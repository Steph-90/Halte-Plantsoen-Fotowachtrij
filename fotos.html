<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halte Plantsoen · Foto's</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #21170f;
  color: #2b1b10;
  font-family: Georgia, "Times New Roman", serif;
}

header {
  text-align: center;
  padding: 28px 18px 20px;
  background:
    linear-gradient(rgba(220,198,151,.93), rgba(194,164,111,.94));
  border-bottom: 7px double #49301b;
  box-shadow: 0 5px 18px #0009;
}

h1 {
  margin: 0;
  font-family: "Old English Text MT", "UnifrakturCook",
    "Blackletter", Georgia, serif;
  font-size: clamp(36px, 7vw, 72px);
  font-weight: 900;
  letter-spacing: 1px;
  text-shadow: 2px 2px #a88a5a;
}

.sub {
  margin-top: 10px;
  font-size: 16px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 22px 16px 40px;
}

.intro {
  text-align: center;
  margin: 0 0 24px;
  padding: 18px 10px;
  color: #e1c89b;
  font-size: 20px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
  border-bottom: 1px solid #8b6842;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.photo {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  cursor: pointer;
  display: block;
  padding: 7px;
  background: #d8c49a;
  border: 1px solid #795333;
  box-shadow: 3px 4px 0 #100b07, 0 0 10px #0008;
  transform: rotate(-1deg);
  transition: transform .2s, box-shadow .2s;
}

.photo:nth-child(even) {
  transform: rotate(1deg);
}

.photo:hover {
  transform: rotate(0) scale(1.03);
  box-shadow: 0 0 18px #c5a36b88;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 50px 20px;
  color: #d8c49a;
  border: 2px dashed #795333;
  background: #302116;
  font-size: 18px;
}

.viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(8, 5, 3, .96);
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.viewer.open {
  display: flex;
}

.viewer img {
  max-width: 96vw;
  max-height: 90vh;
  object-fit: contain;
  padding: 9px;
  background: #d8c49a;
  border: 3px double #795333;
  box-shadow: 0 0 35px #000;
}

.close {
  position: fixed;
  top: 12px;
  right: 16px;
  border: 1px solid #c5a36b;
  background: #21170f;
  color: #e9dcc0;
  font-size: 32px;
  line-height: 1;
  cursor: pointer;
  padding: 8px 13px;
}

@media (max-width: 800px) {
  .gallery {
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
}

@media (max-width: 500px) {
  header {
    padding: 22px 10px 16px;
  }

  .sub {
    font-size: 12px;
    letter-spacing: 1px;
  }

  main {
    padding: 14px 10px 30px;
  }

  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .intro {
    font-size: 15px;
    letter-spacing: 1px;
  }
}
</style>
</head>
<body>
<header>
<h1>Halte Plantsoen</h1>
<div class="sub">1913 · Halloween · 23 oktober 2026</div>
</header>
<main>
<p class="intro">De foto's van de reizigers van Trein 13</p>
<div class="gallery" id="gallery">
<div class="empty">De eerste foto's verschijnen hier zodra ze zijn gepubliceerd.</div>
</div>
</main>
<div class="viewer" id="viewer">
<button class="close" id="close" aria-label="Sluiten">×</button>
<img id="largePhoto" alt="Grote foto">
</div>
<script>
const gallery=document.getElementById("gallery");
const viewer=document.getElementById("viewer");
const largePhoto=document.getElementById("largePhoto");
const close=document.getElementById("close");
const publishedPhotos=[];
function showGallery(){
 gallery.innerHTML="";
 if(!publishedPhotos.length){
  gallery.innerHTML='<div class="empty">De eerste foto\'s verschijnen hier zodra ze zijn gepubliceerd.</div>';
  return;
 }
 publishedPhotos.forEach(src=>{
  const img=document.createElement("img");
  img.className="photo"; img.src=src; img.alt="Foto Halte Plantsoen";
  img.onclick=()=>{largePhoto.src=src;viewer.classList.add("open")};
  gallery.appendChild(img);
 });
}
function closeViewer(){viewer.classList.remove("open");largePhoto.src=""}
close.onclick=closeViewer;
viewer.onclick=e=>{if(e.target===viewer)closeViewer()};
showGallery();
</script>
</body>
</html>
